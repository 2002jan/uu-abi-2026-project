[project]
name = "dashboard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "datashader>=0.19.1",
    "hvplot>=0.13.0",
    "panel>=1.10.0",
    "watchfiles>=1.3.0",
    "zarr-project",
    "param>=2.4.2"
]

[project.scripts]
dashboard = "dashboard:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
zarr-project = { workspace = true }
