[project]
name = "zarr-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dask[distributed]>=2026.8.0",
    "matplotlib>=3.11.2",
    "pbzarr>=0.9.0",
    "scipy>=1.18",
    "xarray>=2026.9.0",
    "numpy>=2.5.5"
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
]

[tool.uv.workspace]
members = [
    "ui",
]
